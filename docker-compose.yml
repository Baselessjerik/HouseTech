services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: housetech
      POSTGRES_USER: housetech
      POSTGRES_PASSWORD: housetech
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U housetech -d housetech"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    working_dir: /app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: dev-docker-only-change-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      DATABASE_URL: postgres://housetech:housetech@db:5432/housetech
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - pqr_media:/app/media
    env_file:
      - path: ./backend/.env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    # Proceso periódico de reservas: libera solicitudes no confirmadas, envía recordatorios y
    # finaliza reservas vencidas (python manage.py procesar_reservas) cada 5 minutos.
    build:
      context: ./backend
    working_dir: /app
    command: ["sh", "-c", "while true; do python manage.py procesar_reservas || true; sleep 300; done"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SECRET_KEY: dev-docker-only-change-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      DATABASE_URL: postgres://housetech:housetech@db:5432/housetech
    volumes:
      - ./backend:/app
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  pqr_media:
